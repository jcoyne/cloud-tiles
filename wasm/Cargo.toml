[package]
name = "cloud-tiles-wasm"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
publish = false
description = "wasm-bindgen wrapper around the j2k JPEG 2000 / HTJ2K decoder"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# frames-sg/j2k at 8becfd9f7bbae861abe35842caaad3376a438aad,
# checked out into vendor/ by build.sh.
# Without `parallel` (rayon): we always decode serially, and it adds ~80 KB gzipped.
# Without `profile`: a browser can't set J2K_PROFILE_STAGES, and it adds ~16 KB gzipped.
j2k-native = { path = "vendor/j2k/crates/j2k-native", default-features = false, features = ["std", "simd"] }
wasm-bindgen = "=0.2.129"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
